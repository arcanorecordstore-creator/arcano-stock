{# Reproductor flotante compartido (tienda y ficha del admin). Lo maneja static/js/player.js. #}
<!-- Player flotante compartido: una sola interfaz para YouTube, SoundCloud y MP3/MP4 -->
<div class="floating-player" id="floating-player" hidden>
    <div class="fp-progress-row">
        <span class="fp-time" id="fp-time-cur">0:00</span>
        <div class="fp-progress" id="fp-progress" role="slider" aria-label="Progreso" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fp-progress-fill" id="fp-progress-fill"></div>
            <div class="fp-progress-knob" id="fp-progress-knob"></div>
        </div>
        <span class="fp-time" id="fp-time-total">0:00</span>
    </div>
    <div class="fp-main">
        <div class="fp-controls">
            <button type="button" class="fp-ctrl" id="fp-prev" aria-label="Anterior" title="Anterior">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            <button type="button" class="fp-ctrl fp-ctrl-play" id="fp-playpause" aria-label="Reproducir" title="Reproducir / Pausar">
                <svg class="fp-ico-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
                <svg class="fp-ico-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
            </button>
            <button type="button" class="fp-ctrl" id="fp-next" aria-label="Siguiente" title="Siguiente">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
        </div>
        <div class="fp-cover"><img id="fp-cover" alt=""></div>
        <div class="fp-info">
            <div class="fp-title" id="fp-title">-</div>
            <div class="fp-sub" id="fp-sub"></div>
        </div>
        <button type="button" class="fp-cart-btn" id="fp-cart" hidden aria-label="Agregar al carrito">
            <span class="fp-cart-add">&#43; Agregar al carrito</span>
            <span class="fp-cart-in" hidden>&#10003; En el carrito</span>
        </button>
        <div class="fp-actions">
            <div class="fp-volume" id="fp-volume">
                <button type="button" class="fp-ctrl fp-ctrl-sm fp-vol-btn" id="fp-vol-btn" aria-label="Silenciar" title="Silenciar / activar sonido">
                    <svg class="fp-ico-vol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 6a8 8 0 0 1 0 12"></path></svg>
                    <svg class="fp-ico-mute" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
                </button>
                <input type="range" class="fp-vol-slider" id="fp-vol-slider" min="0" max="100" value="100" aria-label="Volumen" title="Volumen">
            </div>
            <button type="button" class="fp-ctrl fp-ctrl-sm" id="fp-queue" aria-label="Ver la lista" title="Ver la lista">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>
            </button>
            <button type="button" class="fp-ctrl fp-ctrl-sm" id="fp-close" aria-label="Cerrar" title="Cerrar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
            </button>
        </div>
        <!-- Motores de audio, ocultos: la UI de arriba los maneja -->
        <audio id="fp-audio" preload="none"></audio>
        <div id="fp-engine-slot" class="fp-engine-slot" aria-hidden="true"></div>
    </div>
    <div class="fp-queue-panel" id="fp-queue-panel" hidden></div>
    <a class="fp-fallback-link" id="fp-fallback" href="#" target="_blank" rel="noopener" hidden></a>
</div>
