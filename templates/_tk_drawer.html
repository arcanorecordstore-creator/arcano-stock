{# Panel lateral para ver y editar una tarea/idea completa (titulo + nota) #}
<div class="tkd" id="tk-drawer" hidden>
    <div class="tkd-bg" data-tkd-close></div>
    <aside class="tkd-panel" role="dialog" aria-modal="true" aria-labelledby="tkd-titulo">
        <header class="tkd-head">
            <div class="tkd-meta"></div>
            <button type="button" class="tkd-x" data-tkd-close aria-label="Cerrar (Esc)" title="Cerrar (Esc)">&times;</button>
        </header>
        <textarea id="tkd-titulo" class="tkd-titulo" rows="1" maxlength="200" aria-label="Título"></textarea>
        <section class="tkd-subs" hidden>
            <div class="tkd-bar">
                <span class="tkd-label">Subtareas</span>
                <span class="tkd-subs-prog"></span>
            </div>
            <div class="tkd-subs-track" aria-hidden="true"><span></span></div>
            <ul class="tkd-subs-list"></ul>
            <label class="tkd-subs-new">
                <span aria-hidden="true">+</span>
                <input type="text" maxlength="300" placeholder="Agregar subtarea · Enter" aria-label="Nueva subtarea">
            </label>
        </section>
        <div class="tkd-bar">
            <span class="tkd-label">Nota</span>
            <button type="button" class="tkd-edit">Editar</button>
        </div>
        <div class="tkd-view" tabindex="0"></div>
        <textarea class="tkd-text" hidden placeholder="Escribí lo que quieras: pasos, planos, links, textos… (**negrita**, listas con -)"></textarea>
        <footer class="tkd-foot"><span class="tkd-status" aria-live="polite"></span></footer>
    </aside>
</div>
