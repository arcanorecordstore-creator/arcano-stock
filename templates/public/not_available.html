{% extends "public/base.html" %}

{% block title %}Disco no disponible &middot; Arcano{% endblock %}

{% block content %}

<section class="public-not-found">
    <h1>Este disco ya no esta disponible</h1>
    <p><strong>{{ disc.artista }} - {{ disc.titulo }}</strong> esta {{ disc.estado|lower }}.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary">Ver otros discos</a>
</section>

{% endblock %}
