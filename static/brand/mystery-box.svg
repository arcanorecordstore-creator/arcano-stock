<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Mystery Box de Arcano">
  <rect width="600" height="600" fill="#FFF7EC"/>
  <!-- etiqueta -->
  <text x="300" y="92" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif"
        font-size="34" font-weight="500" letter-spacing="8" fill="#3D3033">MYSTERY BOX</text>
  <!-- tapas abiertas (beige), a los lados -->
  <path d="M175 300 L115 248 L245 248 L300 300 Z" fill="#E9D1AF" stroke="#3D3033" stroke-width="12" stroke-linejoin="round"/>
  <path d="M425 300 L485 248 L355 248 L300 300 Z" fill="#E9D1AF" stroke="#3D3033" stroke-width="12" stroke-linejoin="round"/>
  <!-- cuerpo de la caja (plano, de frente) -->
  <rect x="175" y="300" width="250" height="192" rx="16" fill="none" stroke="#3D3033" stroke-width="12" stroke-linejoin="round"/>
  <!-- signo de pregunta, centrado en la caja -->
  <text x="300" y="416" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', Arial, sans-serif" font-size="118" font-weight="700" fill="#3D3033">?</text>
</svg>
