<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Mystery Box de Arcano">
  <rect width="600" height="600" fill="#FFF7EC"/>
  <!-- paneles de atras (la tapa) en beige: izquierdo y derecho -->
  <path d="M150 275 L300 200 L300 350 Z" fill="#E9D1AF"/>
  <path d="M300 200 L450 275 L300 350 Z" fill="#E9D1AF"/>
  <!-- wireframe de la caja, paleta de marca (marron sobre crema) -->
  <g fill="none" stroke="#3D3033" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- cuerpo -->
    <path d="M150 275 L300 350 L450 275 L450 445 L300 520 L150 445 Z"/>
    <!-- tapa -->
    <path d="M150 275 L300 200 L450 275 L300 350 Z"/>
    <!-- aristas internas: vertical completa (divide los dos paneles) -->
    <path d="M300 200 L300 520"/>
  </g>
  <!-- signo de pregunta, centrado en el panel derecho -->
  <text x="352" y="282" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', Arial, sans-serif" font-size="86" font-weight="700" fill="#3D3033">?</text>
  <!-- etiqueta -->
  <text x="300" y="90" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif"
        font-size="34" font-weight="500" letter-spacing="8" fill="#3D3033">MYSTERY BOX</text>
</svg>
